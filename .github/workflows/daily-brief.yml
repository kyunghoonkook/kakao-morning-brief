name: 아침 브리핑

on:
  schedule:
    # 00:00 UTC = 09:00 KST. GitHub은 혼잡 시 몇 분~수십 분 늦게 실행할 수 있습니다.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "카카오톡 발송 없이 내용만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 생성 및 발송
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL || 'claude-sonnet-5' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python main.py

      - name: 브리핑 페이지 커밋
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          else
            echo "변경된 페이지가 없습니다."
          fi

      # 카카오 리프레시 토큰은 만료가 가까워지면 새로 발급됩니다.
      # GH_PAT(스코프: repo 또는 Fine-grained의 Secrets 쓰기)를 등록해두면 자동으로 갱신됩니다.
      - name: 리프레시 토큰 시크릿 갱신
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          FILE=scripts/.new_refresh_token
          if [ -f "$FILE" ] && [ -n "$GH_TOKEN" ]; then
            gh secret set KAKAO_REFRESH_TOKEN --body "$(cat $FILE)"
            rm "$FILE"
            echo "KAKAO_REFRESH_TOKEN을 갱신했습니다."
          fi
